<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Charts Hourly Candle Trend Forecast</title>
    <style>
        body {
            background-color: rgb(24, 26, 27);
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: gold;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: rgb(32, 100, 101);
            border: 2px solid gold;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .collapsible {
            background-color: gold;
            color: black;
            cursor: pointer;
            padding: 15px;
            width: 100%;
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .active, .collapsible:hover {
            background-color: rgb(230, 190, 50);
        }
        .content {
            padding: 10px 0;
            display: none;
            overflow: hidden;
        }
        input, select, button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 100%;
        }
        button.primary {
            background-color: gold;
            color: black;
            font-weight: bold;
            border: none;
        }
        .kanban-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background-color: gold;
            color: black;
            border-radius: 10px;
            padding: 10px;
            margin-top: 20px;
        }
        .kanban-column {
            background-color: rgb(140, 206, 206);
            border-radius: 5px;
            flex: 1;
            margin: 10px;
            min-width: 250px;
            padding: 10px;
        }
        .kanban-column h3 {
            text-align: center;
        }
        .kanban-item {
            background-color: #f4f4f4;
            color: black;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        #chart {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .candle {
            width: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            font-size: 10px;
            color: white;
            font-weight: bold;
        }
        .candle div {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<h1 style="text-align: center;"> AltosQuant Dashboard™ | V2025</h1>
<div class="dashboard">
    <div class="card">
        <button class="collapsible">Compound Interest Calculator</button>
        <div class="content">
            <label>Initial Amount ($):</label>
            <input type="number" id="initialAmount" placeholder="Enter Initial Amount">
            <label>Weekly Growth Rate (%):</label>
            <input type="number" id="weeklyGrowthRate" step="0.01" placeholder="Enter Weekly Growth Rate">
            <label>Number of Weeks:</label>
            <input type="number" id="numberOfWeeks" placeholder="Enter Number of Weeks">
            <button class="primary" onclick="calculate()">Calculate</button>
            <h3 id="result">Final Compounded Amount: $0.00</h3>
        </div>
    </div>

    <div class="card">
        <button class="collapsible">Trade Objectives</button>
        <div class="content">
            <input type="text" id="tradeObjective" placeholder="Enter your trade objective">
            <button class="primary" onclick="addObjective()">Add Objective</button>
            <ul id="objectiveList"></ul>
        </div>
    </div>

    <div class="card">
        <button class="collapsible">Hourly Trade Forecaster</button>
        <div class="content">
            <label>Select Currency Pair:</label>
            <select id="currencySelector">
                <option value="">Select Pair</option>
                <option value="EUR/USD">EUR/USD</option>
                <option value="USD/JPY">USD/JPY</option>
                <option value="GBP/USD">GBP/USD</option>
                <option value="AUD/USD">AUD/USD</option>
                <option value="USD/CAD">USD/CAD</option>
                <option value="USD/CHF">USD/CHF</option>
                <option value="AUD/CAD">AUD/CAD</option>
                <option value="BTC/USD">BTC/USD</option>
            </select>
            <input type="text" id="spot" onfocus="this.select();" placeholder="Spot Price (FX)" readonly>
            <div id="results"></div>
            <button class="primary" onclick="spotx()">Generate Quant Analysis</button>
        </div>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
        <button class="collapsible">Trades Probability Chart</button>
        <div class="content">
            <div id="chart"></div>
            <div id="mychart" style="width: 100%; height: 500px;"></div>
            <button id="saveData" class="primary">Save Data</button>
        </div>
    </div>
</div>

<div class="kanban-board">
    <div class="kanban-column">
        <h3>Pending Orders</h3>
        <div id="pendingOrders"></div>
    </div>
    <div class="kanban-column">
        <h3>In Progress</h3>
        <div id="ganttItems"></div>
    </div>
    <div class="kanban-column">
        <h3>Finalized Trades</h3>
        <div id="finalizedTrades"></div>
    </div>
</div>

<script src="monitor.js"></script>
<script src="algos.js"></script>
<script>
function calculate() {
    const initialAmount = parseFloat(document.getElementById("initialAmount").value);
    const weeklyGrowthRate = parseFloat(document.getElementById("weeklyGrowthRate").value) / 100;
    const numberOfWeeks = parseInt(document.getElementById("numberOfWeeks").value);
    if (isNaN(initialAmount) || isNaN(weeklyGrowthRate) || isNaN(numberOfWeeks)) {
        alert("Please enter valid numbers for all fields.");
        return;
    }
    const finalAmount = initialAmount * Math.pow((1 + weeklyGrowthRate), numberOfWeeks);
    document.getElementById("result").textContent = `Final compounded amount: $${finalAmount.toFixed(2)}`;
}

var coll = document.getElementsByClassName("collapsible");
for (let i = 0; i < coll.length; i++) {
    coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.display === "block") {
            content.style.display = "none";
        } else {
            content.style.display = "block";
        }
    });
}
</script>

</body>
</html>
